<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCF Sprint</title>
<meta name="description" content="Learn discounted cash flow valuation from zero and get ready for the Financial Modelling & Valuations exam, using the Cool Nomad case.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--soft:#fafafa;--panel:#ffffff;--ink:#0a0a0a;--ink2:#4a4a4a;--muted:#8a8a8a;--faint:#b5b5b5;--line:#e5e5e5;--dotc:#e8e8e8;
  --accent:#0a0a0a;--accent-soft:#f2f2f2;--warn:#5a4500;--warn-soft:#fff8c5;--warn-line:#c8a800;
  --good:#0f9d6e;--good-soft:#e7f7f0;--bad:#c62828;--bad-soft:#fdecea;
  --input:#fff8c5;--code:#f6f6f6;--bar:rgba(255,255,255,.92);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a;--soft:#111;--panel:#0f0f0f;--ink:#f2f2f2;--ink2:#bdbdbd;--muted:#8a8a8a;--faint:#555;--line:#262626;--dotc:#1c1c1c;
  --accent:#f2f2f2;--accent-soft:#1a1a1a;--warn:#f3d36b;--warn-soft:#2a2410;--warn-line:#8a7400;
  --good:#34d399;--good-soft:#0f2a20;--bad:#f87171;--bad-soft:#2d1414;--input:#2a2410;--code:#171717;--bar:rgba(10,10,10,.88);}}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--soft:#111;--panel:#0f0f0f;--ink:#f2f2f2;--ink2:#bdbdbd;--muted:#8a8a8a;--faint:#555;--line:#262626;--dotc:#1c1c1c;
  --accent:#f2f2f2;--accent-soft:#1a1a1a;--warn:#f3d36b;--warn-soft:#2a2410;--warn-line:#8a7400;
  --good:#34d399;--good-soft:#0f2a20;--bad:#f87171;--bad-soft:#2d1414;--input:#2a2410;--code:#171717;--bar:rgba(10,10,10,.88);}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:16px/1.6 "Geist",Inter,-apple-system,system-ui,sans-serif;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;
  background:var(--bg) radial-gradient(circle,var(--dotc) 1px,transparent 1px) 0 0/28px 28px}
::selection{background:var(--ink);color:var(--bg)}
a{color:var(--ink)}
code,.mono,.timer{font-family:"Geist Mono",ui-monospace,monospace}
code{font-size:.82em;background:var(--code);padding:2px 7px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.mlabel{font-family:"Geist Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
/* top bar */
.ibar{position:sticky;top:0;z-index:50;background:var(--bar);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.ibar-inner{max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center}
.brand{font-family:"Geist Mono",monospace;font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.seg{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:none;font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.seg a:hover{color:var(--ink);border-color:var(--ink)}
.seg a.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg a.done:not(.active){color:var(--good);border-color:var(--good)}
.themebtn{flex:none;font-family:"Geist Mono",monospace!important;font-size:10px!important;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px!important}
/* page */
main{max-width:880px;margin:0 auto;padding:0 32px 100px}
.hero{text-align:center;padding:72px 0 40px}
.pill-dark{display:inline-block;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.04em;margin-bottom:22px}
.byline{font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.05em;margin-bottom:22px}
.byline b{color:var(--ink)}
h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;line-height:1.04;letter-spacing:-.035em;margin:0 auto 22px;max-width:800px}
.home .hero h1{font-size:clamp(40px,7vw,80px)}
.lead{color:var(--ink2);font-size:18px;max-width:640px;margin:0 auto 8px;line-height:1.55}
.lead b{color:var(--ink)}
h2{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:64px 0 16px;padding-top:28px;border-top:1px solid var(--line)}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:28px 0 10px}
p,li{color:var(--ink2)} b,strong{color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 26px;margin:16px 0;color:var(--ink2)}
.callout{border:1px solid var(--line);border-left:3px solid var(--ink);background:var(--panel);padding:16px 20px;border-radius:8px;margin:16px 0;color:var(--ink2);font-size:15px}
.callout::before{content:"Note";display:block;font-family:"Geist Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.callout.warn{border-left-color:var(--warn-line);background:var(--warn-soft)}
.callout.warn::before{content:"Watch out";color:var(--warn)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.bad::before{content:"Error";color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin:20px 0}
.grid2 .card{margin:0}
.stat{padding:20px 16px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px}
.grid3 .stat:nth-child(3n){border-right:0}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{display:block;font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;line-height:1.5}
.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.rn+td,th.rn+th{text-align:left}
thead th{background:var(--soft);font-family:"Geist Mono",monospace;font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
tr.sub td{font-weight:700;color:var(--ink)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--ink)!important;color:var(--bg)!important}
tr.sel td.f{color:var(--bg)!important}
td.rn,th.rn{color:var(--muted);font-family:"Geist Mono",monospace;font-size:11px;width:34px;text-align:center}
td.in{background:var(--input);color:var(--warn)}
td.f{font-family:"Geist Mono",monospace;font-size:12px;text-align:left;color:var(--ink)}
td input{width:76px;padding:4px 7px;border:1px dashed var(--warn-line);border-radius:4px;background:var(--input);color:var(--ink);font:inherit;text-align:right}
td input.ok,input.ok{border:1px solid var(--good);background:var(--good-soft)}
td input.no,input.no{border:1px solid var(--bad);background:var(--bad-soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button,.btn{font:inherit;font-size:13px;font-weight:500;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s,border-color .15s}
button:hover,.btn:hover{border-color:var(--ink)}
button.primary,.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary:hover,.btn.primary:hover{opacity:.85}
button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
label.f{display:flex;flex-direction:column;font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);gap:6px}
label.f input,select{font:15px "Geist",Inter,sans-serif;letter-spacing:0;text-transform:none;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;outline:none}
label.f input:focus,select:focus,.qrow input:focus{border-color:var(--ink)}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:12px 0}
.explain{min-height:64px}
.quiz .q{margin:18px 0 8px;font-weight:600;color:var(--ink)}
.quiz .opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:8px;padding:11px 16px;font-size:14.5px}
.quiz .opt.right{border-color:var(--good);background:var(--good-soft)}
.quiz .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;color:var(--muted);margin:6px 0 0}
.qrow{display:grid;grid-template-columns:40px 1fr 130px auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .num{color:var(--muted);font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.1em}
.qrow input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:right;outline:none}
.qrow .acts{display:flex;gap:6px}
.qrow .hint{grid-column:2/-1;font-size:13.5px;color:var(--muted)}
.pill{display:inline-block;font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink)}
.next{display:flex;justify-content:space-between;align-items:center;margin-top:56px;padding-top:24px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
.next>span{display:flex;gap:8px;flex-wrap:wrap}
.timer{font-size:22px;font-weight:600}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin:16px 0}
.flow span{padding:16px 12px;text-align:center;font-size:13px;font-weight:600;color:var(--ink);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.flow span::before{content:counter(fl,decimal-leading-zero);counter-increment:fl;display:block;font-family:"Geist Mono",monospace;font-size:10px;font-weight:500;letter-spacing:.15em;color:var(--muted);margin-bottom:6px}
.flow{counter-reset:fl}
.flow span:last-of-type{background:var(--ink);color:var(--bg)}
.flow em{display:none}
.index{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;margin:20px 0}
.index a{display:grid;grid-template-columns:64px 1fr auto auto;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);align-items:center;transition:background .15s}
.index a:last-child{border-bottom:0}
.index a:hover{background:var(--soft)}
.index .n{font-family:"Geist Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}
.index .t{font-size:15px;font-weight:500}
.index .tag{font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.index .tag.ok{color:var(--good);border-color:var(--good)}
.index .ar{font-family:"Geist Mono",monospace;color:var(--muted)}
.index a.act{background:var(--ink)}
.index a.act .t,.index a.act .ar{color:var(--bg);font-weight:600}
.index a.act .tag{color:var(--bg);border-color:#555}
.outro{margin:80px 0 0;padding:90px 32px;text-align:center;background:#0a0a0a;color:#f2f2f2;border:1px solid #2a2a2a;border-radius:16px}
.outro h2{border:0;padding:0;margin:0 auto 16px;font-size:clamp(30px,5vw,52px);color:#f2f2f2;max-width:700px}
.outro p{color:#a8a8a8;max-width:560px;margin:0 auto 26px}
.outro .btn.primary{background:#f2f2f2;color:#0a0a0a;border-color:#f2f2f2}
ul.tight,ol.tight{padding-left:20px;margin:6px 0}
ul.tight li,ol.tight li{margin:6px 0}
@media (max-width:860px){
  .ibar-inner{padding:10px 16px;gap:10px}
  main{padding:0 16px 80px}
  .hero{padding:44px 0 24px}
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .grid3 .stat{border-right:0}
  .qrow{grid-template-columns:30px 1fr}
  .qrow input,.qrow .acts{grid-column:2}
  .index a{grid-template-columns:44px 1fr auto;padding:14px 16px}
  .index .tag{display:none}
  .outro{margin:60px 0 0;padding:64px 18px}
  .card{padding:18px}
}
@media print{
  .ibar,.toolbar,.next,button,.outro,.hero .pill-dark,.byline{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  main{padding:0;max-width:none} .hero{padding:0 0 10px;text-align:left} h1{font-size:26px}
  .card{break-inside:avoid}
}
</style>
</head>
<body>
<header class="ibar"><div class="ibar-inner">
  <a class="brand" href="#home">DCF Sprint</a>
  <nav class="seg" id="topnav"></nav>
  <button class="themebtn" id="theme">Theme</button>
</div></header>
<main id="app"></main>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
